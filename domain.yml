  utter_about_project:
  - text: |
      🌿 Şifa Bardakta Nedir?

      Şifa Bardakta; günlük hafif rahatsızlıklar için uluslararası bilimsel kaynaklara dayalı destekleyici bitkisel içecek tarifleri sunan bir bilgi asistanıdır.

      💡 Nasıl Kullanılır? 
      
      Yaşadığınız şikayeti sohbet ekranına yazın; asistanımız malzeme listesi, pratik hazırlanış adımları ve bilimsel kaynak bilgisi içeren en uygun tarifi anında sunsun.

      📌 Amaç:

      Doğanın şifasını ve bilimsel literatüre dayalı güvenilir bilgileri en pratik şekilde bardağınıza taşımaktır

      ⚠️ Önemli:

      Şifa Bardakta tıbbi bir teşhis, tanı veya tedavi aracı değildir; sunulan içerikler yalnızca genel bilgilendirme ve destek amaçlıdır.


  utter_how_it_works:
  - text: |
      🤖 Şifa Bardakta Nasıl Çalışır?

      1️⃣ Belirtinizi Yazın: Yaşadığınız rahatsızlığı sohbet alanına yazın. (Örn: "baş ağrısı", "mide bulantısı", "stres", "uykusuzluk")

      2️⃣ Akıllı Analiz: Asistanımız şikayetinizi analiz eder ve bilimsel literatürle eşleşen en uygun doğal çözümü bulur.

      3️⃣ Şifalı Yanıtınızı Alın: Size özel şu bilgiler anında sunulur: • 🌿 Doğal İçecek Tarifi • 🥄 Tam Malzeme Ölçüleri • 🔥 Adım Adım Hazırlanış • 📚 Bilimsel Kaynak (WHO, EMA) • ⚠️ Özel Kullanım Uyarıları

      ✨ Doğanın şifasına güvenilir yoldan ulaşmak işte bu kadar kolay!


  utter_scientific_sources:
  - text: |
      🔬 Bilimsel Kaynaklarımız & Metodoloji

      Şifa Bardakta'da sunulan tüm içecek tarifleri, etken maddeler ve kullanım önerileri uluslararası alanda kabul görmüş tıbbi ve farmakolojik kaynaklar taranarak hazırlanmıştır:

      🌐 Uluslararası Sağlık Örgütleri:
      • WHO (Dünya Sağlık Örgütü) Geleneksel Tıp Raporları
      • EMA (Avrupa İlaç Ajansı) Bitkisel İlaç Monografları

      📊 Akademik Veri Tabanları:
      • PubMed / MEDLINE Tıbbi Araştırma Makaleleri
      • Geleneksel ve Tamamlayıcı Tıp Literatürü

      🎯 Amacımız kulaktan dolma bilgiler değil, bilimin ve araştırmaların ışığında güvenilir içerikler sunmaktır.

      ⚠️ Yasal Sorumluluk Reddi:
      Bu bilgiler yalnızca genel kültür ve destek amaçlıdır; tıbbi teşhis, reçete veya tedavi yerine geçmez.



  utter_safety_info:
  - text: |
      ⚠️ Önemli Sağlık & Güvenlik Uyarıları

      Şifa Bardakta'da sunulan tüm bilgiler genel yaşam kalitesini desteklemek amacıyla hazırlanmıştır. Uygulamamız tıbbi teşhis, tanı, reçete veya tedavi amacı taşımaz.

      🚨 Özel Hassasiyet Gerektiren Durumlar:
      Herhangi bir bitkisel içeceği tüketmeden önce şu durumlarda mutlaka hekiminize danışınız:

      • 🩸 Kronik Hastalıklar (Tansiyon, Şeker, Kalp vb.)
      • 🤰 Hamilelik ve Emzirme Dönemleri
      • 💊 Düzenli İlaç Kullanımı (Özellikle kan sulandırıcılar)
      • 🌿 Bilinen Bitki/Polen Alerjileri
      • 👶 1 Yaş Altı Çocuklar (Özellikle bal içeren tarifler)

      🩺 Acil ve Şiddetli Durumlar:
      Şiddetli ağrı, yüksek ateş veya ani gelişen belirtilerde zaman kaybetmeden bir sağlık kuruluşuna başvurunuz.



  utter_project_team:
  - text: |
      👨‍💻 Proje & Geliştirici Ekip Hakkında

      🌱 Şifa Bardakta Nedir? Şifa Bardakta, kullanıcıların günlük sağlık şikayetlerine yönelik güvenilir bitkisel tariflere pratik şekilde ulaşmalarını sağlayan yapay zeka destekli bir mobil sağlık asistanıdır.

      🧠 Teknolojik Altyapı: Projemiz; kullanıcı mesajlarını gelişmiş Doğal Dil İşleme (NLP) modellerimizle analiz eder. Bilimsel makaleler (WHO, EMA, PubMed) taranarak hazırlanan veri tabanımız ile en doğru tarifi ve güvenlik uyarılarını anında eşleştirerek sunar. 

      🎓 Geliştiriciler: Bu Proje Selçuk Üniversitesi Bilgisayar Mühendisliği son sınıf öğrencileri; Proje Yürütücüsü Oğuzhan Göktemir, İbrahim Can Kızbaz ve Mustafa Körömeroğulları tarafından geliştirilmiştir. 


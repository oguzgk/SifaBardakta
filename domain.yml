  utter_sac_dokulmesi:
  - text: |
      💇‍♀️ Saç Dökülmesi (Destekleyici)

      Öneri 1 — Isırgan – Kuşburnu – Limon Kabuğu Çayı
      📚 Dayanak: WHO Traditional Use (nettle minerals for hair), PubMed (iron & silica content)

      Malzemeler:
      - 1 tatlı kaşığı kurutulmuş ısırgan otu
      - 1 tatlı kaşığı kuşburnu
      - Bir parça kurutulmuş limon kabuğu
      - 1 su bardağı sıcak su

      Yapılışı:
      1. Suyu kaynatın.
      2. Isırgan ve kuşburnu ekleyin.
      3. 7-10 dakika demlemeye bırakın.
      4. Limon kabuğu ekleyip 2 dakika daha demlemeye bırakın.
      5. Süzün ve tüketin.

      Öneri 2 — Biberiye – Papatya – Kızılcık Çayı
      📚 Dayanak: WHO Traditional Use (rosemary circulation), EMA (chamomile support)

      Malzemeler:
      - 1 tatlı kaşığı kurutulmuş biberiye
      - 1 tatlı kaşığı papatya
      - 1 tatlı kaşığı kurutulmuş kızılcık
      - 1 su bardağı sıcak su

      Yapılışı:
      1. Tüm bitkileri kaynatılan su içinde bekletin.
      2. 7-8 dakika demleyin.
      3. Süzün ve sabah içeceğiniz için hazırlayın.

      ⏰ Tüketim Önerisi: Günde 1 fincan, sabah veya öğle saatleri | 2-3 haftalık kür

      ⚠️ Uyarı:
      Hormonal, genetik veya ciddi saç dökülmelerinde bir uzmana danışılmalıdır.
      Hamile/emziren kadınlar hekim onayıyla tüketmelidir.

      ℹ️ Destekleyici amaçlıdır, tıbbi tedavi yerine geçmez. Özel sağlık durumlarında doktorunuza danışınız.


  utter_hemoroid:
  - text: |
      🍵 Hemoroid (Destekleyici)

      Öneri 1 — Papatya – Rezene – Ihlamur Çayı
      📚 Dayanak: WHO Traditional Use (chamomile soothing), EMA Herbal Monographs (fennel digestive)

      Malzemeler:
      - 1 tatlı kaşığı papatya
      - 1 çay kaşığı rezene tohumu
      - 1 tatlı kaşığı ıhlamur
      - 1 su bardağı sıcak su

      Yapılışı:
      1. Tüm bitkiler bir fincana alınır.
      2. Üzerine sıcak su eklenir.
      3. 7-8 dakika demlemeye bırakılır.
      4. Süzülerek içilir.

      Öneri 2 — Ot Çayı – Ihlamur – Anason Kombinasyonu
      📚 Dayanak: PubMed (fennel seed digestive support), WHO Traditional Use

      Malzemeler:
      - 1 tatlı kaşığı ıhlamur çiçeği
      - 1 çay kaşığı anason tohumu
      - 1 tatlı kaşığı yaprak çay (tercihen yeşil çay)
      - 1 su bardağı sıcak su

      Yapılışı:
      1. Suyu kaynatın.
      2. Tüm malzemeleri ekleyin.
      3. 8-10 dakika demleyin.
      4. Süzün ve akşam saatlerinde tüketin.

      ⏰ Tüketim Önerisi: Günde 1 fincan, tercihen akşam | 1-2 haftalık düzenli tüketim

      ⚠️ Uyarı:
      Şiddetli ağrı, kanama veya uzun süren şikayetlerde mutlaka sağlık uzmanına başvurulmalıdır.
      Hamile kadınlar hekim onayıyla kullanmalıdır.

      ℹ️ Destekleyici amaçlıdır, tıbbi tedavi yerine geçmez. Özel sağlık durumlarında doktorunuza danışınız.


  utter_cilt_lekeleri:
  - text: |
      🎭 Cilt Lekeleri (Cilt Sağlığı & Antioksidan Destek)

      Öneri 1 — Yeşil Çay – Kuşburnu – Hibiskus Çayı
      📚 Dayanak: WHO (green tea antioxidants), PubMed (polyphenol skin health), EMA (rosehip vitamin C)

      Malzemeler:
      - 1 çay kaşığı yeşil çay
      - 1 tatı kaşığı kuşburnu
      - 1 tatılı kaşığı kurutulmuş hibiskus
      - 1 su bardağı sıcak su

      Yapılışı:
      1. Suyu kaynatın.
      2. Yeşil çayı ekleyin, 3-4 dakika demlemeye bırakın.
      3. Kuşburnu ve hibiskusu ekleyin.
      4. 4-5 dakika daha demlemeye bırakın.
      5. Süzülerek tüketin.

      Öneri 2 — Gül Taç – Papatya – Limon Çayı
      📚 Dayanak: WHO Traditional Use (rose antioxidant), PubMed (chamomile skin support)

      Malzemeler:
      - 1 tatılı kaşığı kurutulmuş gül taç
      - 1 tatılı kaşığı papatya
      - Bir parça kurutulmuş limon kabuğu
      - 1 su bardağı sıcak su

      Yapılışı:
      1. Suyu kaynatın.
      2. Gül taç ve papatyayı ekleyin.
      3. 7-8 dakika demleyin.
      4. Limon kabuğu ekleyip 1 dakika bekletin.
      5. Süzülerek tüketin.

      ⏰ Tüketim Önerisi: Günde 1-2 fincan, tercihen sabah veya öğle | 2-3 haftalık kür

      ⚠️ Uyarı:
      Şiddetli, büyüyen veya endişe verici lekeler için dermatolog değerlendirmesi gerekli olabilir.
      Hamile/emziren kadınlar hekim onayıyla tüketmelidir.

      ℹ️ Destekleyici amaçlıdır, tıbbi tedavi yerine geçmez. Özel sağlık durumlarında doktorunuza danışınız.



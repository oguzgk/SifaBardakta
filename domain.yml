      2. Ihlamur ve melisayı ekleyin.
      3. 5-7 dakika demleyin.
      4. Limon kabuğu ekleyip 1 dakika bekleyin.
      5. Süzülerek tüketin.

      ⏰ Tüketim Önerisi: Günde 1 fincan, tercihen öğleden sonra | 2 hafta düzenli

      ⚠️ Uyarı:
      Şiddetli veya iltihaplı akne durumlarında dermatoloğa başvurulmalıdır.

      📚 Dayanak: WHO (linden flower wellness), EMA (sage hormonal support)

      Malzemeler:
      - 1 tatlı kaşığı ıhlamur çiçeği
      - 1 tatlı kaşığı kuru adaçayı
      - 1 su bardağı sıcak su

      Yapılışı:
      1. Suyu kaynatın.
      2. Ihlamur ve adaçayını ekleyin.
      3. 5-7 dakika demleyin.
      4. Süzün ve ilık olarak tüketin.

      ⚠️ Uyarı: Hamilelik döneminde tüketmeyin. Şiddetli PMS semptomları doktor konsültasyonu gerektirir.

      ℹ️ Bilgi Kaynağı: WHO • EMA • PubMed
      ℹ️ Bu içerik bilgilendirme amaçlıdır, tedavi yerine geçmez.

  utter_gun_ici_halsizlik:
  - text: |
      🛌 Gün İçi Halsizlik

      Öneri 1 — Zencefil – Limon Ilık İçeceği
      📚 Dayanak: PubMed (ginger circulation & energy), WHO Traditional Use

      Malzemeler:
      - 1 tatlı kaşığı taze rendelenmiş zencefil
      - 1 çay kaşığı limon suyu
      - 1 su bardağı ılık su
      - 1 tatlı kaşığı bal

      Yapılışı:
      1. İlık suya zencefili ekleyin.
      2. 5-10 dakika demleyin.
      3. Süzün.
      4. Limon suyu ve bal ekleyin.
      5. Sabah veya öğleden sonra tüketin.

      Öneri 2 — Kuşburnu – Elma Kabuğu Çayı
      📚 Dayanak: PubMed (rosehip Vitamin C energy), WHO (apple peel antioxidants)

      Malzemeler:
      - 1 tatlı kaşığı kurutulmuş kuşburnu
      - 1 tatlı kaşığı kurutulmuş elma kabuğu
      - 1 çubuk tarçın
      - 1 su bardağı sıcak su

      Yapılışı:
      1. Suyu kaynatın.
      2. Kuşburnu, elma kabuğu ve tarçını ekleyin.
      3. 10-15 dakika demleyin.
      4. Süzün ve ilık olarak tüketin.

      ⚠️ Uyarı: Persistan halsizlik doktor değerlendirmesi gerektirir.

      ℹ️ Bilgi Kaynağı: WHO • EMA • PubMed
      ℹ️ Bu içerik bilgilendirme amaçlıdır, tedavi yerine geçmez.

  utter_bogaz_kurulugu:
  - text: |
      🌿 Boğaz Kuruluğu (Yumuşatıcı Bitki Çayı)

      🍋 Ihlamur – Bal – Limon

      📚 Bilimsel Dayanak:
      • EMA – Tilia cordata monograph
      • PubMed – honey throat soothing research

      🧾 Açıklama:
      Ihlamur geleneksel kullanımda boğazı yumuşatıcı bitkiler arasında yer alır.
      Bal ve limon boğaz kuruluğu hissinin azalmasına destek olabilir.

      🥄 Malzemeler:
      - 1 tatlı kaşığı ıhlamur
      - 1 çay kaşığı bal
      - birkaç damla limon
      - 1 su bardağı sıcak su

      🔥 Hazırlanışı:
      1. Ihlamuru sıcak suya ekleyin.
      2. 6-7 dakika demleyin.
      3. Bal ve limonu ekleyip tüketin.


  utter_ses_kisikligi:
  - text: |
      🎤 Ses Kısıklığı (Boğaz Rahatlatıcı)

      🌿 Adaçayı – Bal

      📚 Bilimsel Dayanak:
      • EMA – Salvia officinalis
      • PubMed – sage throat studies

      🧾 Açıklama:
      Adaçayı geleneksel olarak boğaz rahatlatıcı içecekler arasında yer alır.

      🥄 Malzemeler:
      - 1 tatlı kaşığı adaçayı
      - 1 çay kaşığı bal
      - 1 su bardağı sıcak su

      🔥 Hazırlanışı:
      1. Adaçayını sıcak suya ekleyin.
      2. 6 dakika demleyin.
      3. Ilık tüketin.


  utter_cilt_canliligi:
  - text: |
      ✨ Cilt Canlılığı (Antioksidan Destek)

      🍊 Kuşburnu – Hibiskus Çayı

      📚 Bilimsel Dayanak:
      • PubMed – rosehip antioxidant research
      • PubMed – hibiscus antioxidant studies

      🧾 Açıklama:
      Kuşburnu ve hibiskus yüksek antioksidan içeriği ile bilinen bitkiler arasındadır.

      🥄 Malzemeler:
      - 1 tatlı kaşığı kuşburnu
      - 1 tatlı kaşığı hibiskus
      - 1 su bardağı sıcak su

      🔥 Hazırlanışı:
      1. Bitkileri sıcak suya ekleyin.
      2. 8 dakika demleyin.
      3. Süzerek tüketin.


  utter_antioxidant_destek:
  - text: |
      🛡️ Antioksidan Destek

      🌿 Yeşil Çay – Limon

      📚 Bilimsel Dayanak:
      • PubMed – green tea antioxidant studies

      🧾 Açıklama:
      Yeşil çay polifenoller açısından zengin olup antioksidan destek sağlayabilir.

      🥄 Malzemeler:
      - 1 çay kaşığı yeşil çay
      - birkaç damla limon
      - 1 su bardağı sıcak su

      🔥 Hazırlanışı:
      1. Yeşil çayı 3 dakika demleyin.
      2. Limon ekleyerek tüketin.

  utter_about_project:
  - text: |
      🌿 Şifa Bardakta Nedir?

      Şifa Bardakta, kullanıcıların yaşadıkları bazı günlük rahatsızlıklara yönelik
      geleneksel bitkisel içecek önerileri sunan bir bilgi uygulamasıdır.

      Kullanıcılar bir belirti yazdığında, sistem o belirtiye yönelik
      bitki çayı veya doğal içecek tarifleri önerir.

      📌 Amaç:
      Güvenilir kaynaklara dayalı bitkisel içecek bilgilerini
      kolay erişilebilir hale getirmektir.

      ⚠️ Önemli:
      Bu uygulama tıbbi teşhis veya tedavi amacı taşımaz.

  utter_how_it_works:
  - text: |
      🤖 Şifa Bardakta Nasıl Çalışır?

      1️⃣ Yaşadığınız bir belirtiyi yazın
      (örnek: baş ağrısı, mide bulantısı, stres)

      2️⃣ Sistem bu belirtiye uygun
      bitkisel içecek önerilerini analiz eder.

      3️⃣ Size:
      • içecek tarifi
      • malzemeler
      • hazırlanış
      • bilimsel kaynak bilgisi

      sunulur.

      Böylece doğal içecek tariflerine hızlıca ulaşabilirsiniz.

  utter_scientific_sources:
  - text: |
      🔬 Bilimsel Kaynaklar

      Şifa Bardakta'daki içerikler şu kaynaklara dayanmaktadır:

      • Dünya Sağlık Örgütü (WHO)
      • Avrupa İlaç Ajansı bitki monografları (EMA)
      • PubMed bilimsel makaleleri
      • Geleneksel bitkisel kullanım literatürü

      Bu sayede öneriler mümkün olduğunca
      güvenilir kaynaklara dayandırılmaktadır.

      ⚠️ Ancak uygulama tıbbi tedavi yerine geçmez.

  utter_safety_info:
  - text: |
      ⚠️ Sağlık Bilgilendirmesi

      Şifa Bardakta uygulamasındaki öneriler
      bilgilendirme amaçlıdır. Tedavi amaçlı değildir.

      Şu durumlarda bitkisel ürün kullanmadan önce
      sağlık uzmanına danışmanız önerilir:

      • kronik hastalık
      • hamilelik
      • emzirme
      • düzenli ilaç kullanımı
      • bitki alerjileri

      Sağlığınızla ilgili ciddi şikayetlerde
      mutlaka bir doktora başvurunuz.

  utter_project_team:
  - text: |
      👨‍💻 Proje Hakkında

      Şifa Bardakta, kullanıcıların güvenilir bitkisel
      içecek tariflerine ulaşmasını kolaylaştırmak amacıyla
      geliştirilen bir mobil uygulama projesidir.

      Proje kapsamında topladığımız güvenilir verilerle beraber eğittiğimiz doğal dil algılama modelimiz ile kullanıcıdan aldığımız mesajı algılayıp önceden bilimsel makaleler ve yayınları tarayarak hazırladığımız menü ile eşleşerek projemizi çalıştırıyoruz. 

      Bu Proje Selçuk Üniversitesi Bilgisayar Mühendisliği son sınıf öğrencisi Oğuzhan Göktemir ve Hasan Türk tarafından geliştirilmiştir. 

      Destekleriniz, İş birliği ve daha fazlası için bizimle iletişime geçebilirsiniz. 

      Mail : sifabardakta@gmail.com



  utter_egzama:
  - text: |
      🌼 Egzama (Cilt Sağlığı Destekleyici)

      Öneri 1 — Papatya – Rezene – Zerdeçal Çayı
      📚 Dayanak: WHO Traditional Use (chamomile inflammation), EMA (turmeric monograph)

      Malzemeler:
      - 1 tatlı kaşığı papatya
      - 1 çay kaşığı rezene tohumu
      - 1 çay kaşığı toz zerdeçal
      - 1 su bardağı sıcak su
      - (İsteğe bağlı: bir tutam karabiber – emilimi artırmak için)

      Yapılışı:
      1. Tüm malzemeler fincana eklenir.
      2. Üzerine sıcak su ilave edilir.
      3. 7-8 dakika demlemeye bırakılır.
      4. Süzülerek tüketilir.

      Öneri 2 — Ihlamur – Papatya – Karabiber Çayı
      📚 Dayanak: WHO (linden traditional use), PubMed (curcumin bioavailability)

      Malzemeler:
      - 1 tatlı kaşığı ıhlamur çiçeği
      - 1 tatlı kaşığı papatya
      - 1 çay kaşığı toz zerdeçal
      - Bir tutam karabiber
      - 1 su bardağı sıcak su

      Yapılışı:
      1. Suyu kaynatın.
      2. Ihlamur ve papatya ekleyin.
      3. 6-7 dakika demleyin.
      4. Zerdeçal ve karabiber ekleyip 1 dakika daha beklemeye bırakın.
      5. Süzülerek tüketin.

      ⏰ Tüketim Önerisi: Günde 1 fincan, tercihen akşam | 1-2 haftalık kür şeklinde

      ⚠️ Uyarı:
      Alerjik egzama, atopik dermatit veya şiddetli belirtilerde dermatoloji uzmanına başvurulmalıdır.
      Hamile/emziren kadınlar hekim onayıyla kullanmalıdır.

      ℹ️ Destekleyici amaçlıdır, tıbbi tedavi yerine geçmez. Özel sağlık durumlarında doktorunuza danışınız.


  utter_dis_agrisi:
  - text: |
      🦷 Diş Ağrısı (Geçici Destek & Gargara)

      🌿 Karanfil Demlemesi (Gargara)

      📚 Bilimsel Dayanak:
      • EMA – Syzygium aromaticum (Clove) dental use
      • WHO Monographs – Flos Caryophylli (Analgesic effect)
      • PubMed – Eugenol in dental pain relief

      🧾 Açıklama:
      Karanfil, içeriğinde bulunan doğal "Öjenol (Eugenol)" etken maddesi sayesinde geleneksel tıpta ve diş hekimliğinde geçici rahatlatıcı ve antiseptik (mikrop kırıcı) olarak kullanılmaktadır. Ağız içi florasında ferahlama sağlayabilir.

      🥄 Malzemeler:
      - 4-5 adet kuru karanfil tomurcuğu
      - 1 su bardağı sıcak su

      🔥 Hazırlanışı ve Kullanımı:
      1. Sıcak suya karanfilleri ekleyin.
      2. 8-10 dakika demlemeye bırakın.
      3. Süzüp ılık kıvama geldikten sonra ağzınızda 1-2 dakika gargara yapın.
      4. Gargara sonrası suyu tükürün (yutmayın).

      ⚠️ Uyarı:
      Diş ağrısı enfeksiyon veya çürük kaynaklı olabilir; karanfil yalnızca geçici bir destektir. Ağrıyan bölgeye karanfil yağını direkt sürmek diş etini yakabilir. Şiddetli ağrıda mutlaka diş hekimine başvurunuz.

      ℹ️ Destekleyici amaçlıdır, tıbbi tedavi yerine geçmez. Özel sağlık durumlarında doktorunuza danışınız.




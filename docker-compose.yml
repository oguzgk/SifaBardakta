services:
  action_server:
    build:
      context: .
      dockerfile: Dockerfile.actions
    container_name: sifa_bardakta_actions
    restart: always
    ports:
      - "5055:5055"
    volumes:
      - ./actions:/app/actions
    networks:
      - rasa_network

  rasa_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sifa_bardakta_rasa
    restart: always
    ports:
      - "5005:5005"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./config.yml:/app/config.yml
      - ./domain.yml:/app/domain.yml
      - ./credentials.yml:/app/credentials.yml
      - ./endpoints.yml:/app/endpoints.yml
    environment:
      - ACTION_SERVER_URL=http://action_server:5055/webhook
    depends_on:
      - action_server
    networks:
      - rasa_network

networks:
  rasa_network:
    driver: bridge

  utter_burun_tikanikligi:
  - text: |
      🤧 Burun Tıkanıklığı

      Öneri 1 — Zencefil – Nane Buhar Çayı
      📚 Dayanak: WHO Traditional Medicine (decongestant), EMA Herbal Monographs

      Malzemeler:
      - 1 tatlı kaşığı taze rendelenmiş zencefil
      - 1 tatlı kaşığı kuru nane
      - 1 su bardağı sıcak su
      - İsteğe bağlı bal

      Yapılışı:
      1. Suyu kaynatın.
      2. Zencefil ve naneyi ekleyin.
      3. 5-10 dakika demleyin.
      4. Başınızı bir havlu ile örterek buharını 2-3 dakika soluyun (opsiyonel).
      5. Süzün ve bal ekleyip tüketin.

      Öneri 2 — Kekik – Adaçayı Çayı
      📚 Dayanak: EMA (thyme antimicrobial), WHO Traditional Use

      Malzemeler:
      - 1 tatlı kaşığı kuru kekik
      - 1 tatlı kaşığı kuru adaçayı
      - 1 su bardağı sıcak su

      Yapılışı:
      1. Suyu kaynatın.
      2. Kekik ve adaçayını ekleyin.
      3. 5-7 dakika demleyin.
      4. Süzün ve ılık olarak tüketin.

      ℹ️ Destekleyici amaçlıdır, tıbbi tedavi yerine geçmez. Özel sağlık durumlarında doktorunuza danışınız.



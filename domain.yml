  utter_bas_agrisi:
  - text: |
      🤕 Baş Ağrısı (Destekleyici İçecek)

      🌿 Nane – Zencefil Çayı

      📚 Bilimsel Dayanak:
      • EMA Herbal Monograph – Peppermint leaf
      • PubMed – Ginger and headache/migraine support
      • WHO Traditional Herbal Use

      🧾 Açıklama:
      Nane ve zencefil geleneksel tıpta rahatlatıcı bitkiler olarak kullanılır. 
      Antioksidan ve ferahlatıcı özellikleri nedeniyle baş ağrısı yaşayan kişilerde 
      genel rahatlama ve destek sağlayabilir.

      🥄 Malzemeler:
      - 1 tatlı kaşığı kuru nane veya birkaç taze nane yaprağı
      - 1 çay kaşığı rendelenmiş taze zencefil
      - 1 su bardağı sıcak su
      - İsteğe bağlı bal

      🔥 Hazırlanışı:
      1. Suyu kaynatın.
      2. Nane ve zencefili ekleyin.
      3. 5-8 dakika demleyin.
      4. Süzerek tüketin.

      ⚠️ Uyarı:
      Zencefil kan sulandırıcı ilaç kullanan kişilerde dikkatli tüketilmelidir.

      ℹ️ Bu içecek destekleyici amaçlıdır, tıbbi tedavi yerine geçmez.

  utter_mide_bulantisi:
  - text: |
      🤢 Mide Bulantısı (Destekleyici)

      🌿 Zencefil Çayı

      📚 Bilimsel Dayanak:
      • EMA – Zingiber officinale monograph
      • PubMed – Ginger for nausea studies
      • WHO Traditional Medicine

      🧾 Açıklama:
      Zencefil mide bulantısı için en çok araştırılmış bitkilerden biridir.
      Sindirim sistemini destekleyebilir ve bulantı hissinin azalmasına yardımcı olabilir.

      🥄 Malzemeler:
      - 1 çay kaşığı rendelenmiş taze zencefil
      - 1 su bardağı sıcak su
      - İsteğe bağlı bal

      🔥 Hazırlanışı:
      1. Zencefili sıcak suya ekleyin.
      2. 5-7 dakika demleyin.
      3. Süzerek tüketin.

      ⚠️ Uyarı:
      Hamilelikte veya mide hassasiyetinde doktora danışılması önerilir.

      ℹ️ Bu içerik bilgilendirme amaçlıdır.

  utter_ishal:
  - text: |
      💧 İshal (Sindirim Destekleyici)

      🌿 Papatya – Rezene Çayı

      📚 Bilimsel Dayanak:
      • EMA – Chamomile monograph
      • EMA – Fennel seed digestive use
      • WHO Traditional Herbal Medicine

      🧾 Açıklama:
      Papatya ve rezene geleneksel olarak sindirim sistemini desteklemek 
      ve bağırsak rahatsızlıklarında rahatlama sağlamak amacıyla kullanılmaktadır.

      🥄 Malzemeler:
      - 1 tatlı kaşığı papatya
      - 1 çay kaşığı rezene tohumu
      - 1 su bardağı sıcak su

      🔥 Hazırlanışı:

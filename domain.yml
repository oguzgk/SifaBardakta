      2. 6-8 dakika demleyin.
      3. Süzerek tüketin.

      ⚠️ Uyarı:
      Şiddetli veya uzun süren ishal durumunda sağlık uzmanına başvurulmalıdır.

  utter_soguk_alginligi:
  - text: |
      🤧 Soğuk Algınlığı (Bağışıklık Destekleyici)

      🌿 Zencefil – Limon – Bal İçeceği

      📚 Bilimsel Dayanak:
      • WHO Traditional Medicine
      • EMA herbal monographs
      • PubMed – Ginger antioxidant properties

      🧾 Açıklama:
      Zencefil ve limon antioksidan içerikleri sayesinde bağışıklık sistemini 
      destekleyebilir ve soğuk algınlığı dönemlerinde rahatlatıcı bir içecek olabilir.

      🥄 Malzemeler:
      - 1 çay kaşığı rendelenmiş zencefil
      - 1 çay kaşığı limon suyu
      - 1 tatlı kaşığı bal
      - 1 su bardağı sıcak su

      🔥 Hazırlanışı:
      1. Zencefili sıcak suya ekleyin.
      2. 5 dakika demleyin.
      3. Limon ve bal ekleyerek karıştırın.

      ⚠️ Uyarı:
      Bal 1 yaşından küçük çocuklara verilmemelidir.

